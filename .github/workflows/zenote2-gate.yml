# CI — Gate de correctitud de Zenote 2 (backlog técnico: "CI real que corra npm run test:zenote2 en cada push").
# El proyecto es vanilla SIN dependencias → no hace falta `npm install`: sólo Node + correr el runner, que falla (exit 1)
# si algún test de invariantes/conservación/determinismo/ecología se rompe. Cubre los 9 tests del gate (incl. dorado m8 + regresión ecológica m9).
name: Zenote 2 gate

on:
  push:
    paths:
      - 'zenote2/**'
      - '.github/workflows/zenote2-gate.yml'
  pull_request:
    paths:
      - 'zenote2/**'
      - '.github/workflows/zenote2-gate.yml'

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Zenote 2 — gate de correctitud (invariantes + dorado + ecología)
        run: npm run test:zenote2
